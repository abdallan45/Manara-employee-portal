# nginx site for the portal on a server that already runs nginx (installed by deploy.sh with
# PROXY=nginx; __DOMAIN__ and __APP_PORT__ are filled in). certbot --nginx adds the HTTPS server
# block and the redirect from HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Leave documents and Nouria's recordings are uploaded through the app (limits enforced there).
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, never append: the app trusts this header from the proxy only.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
